<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Primary School Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #c4bdbd2f;
        }

        header {
            background-color: #52524d;
            color: black;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 85%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #52524d;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .gallery img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.2);
        }

        .button-group {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #52524d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
        }

        .btn:hover {
            background-color: #3d3d39;
        }

        footer {
            background-color: #4d4f50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 30px;
        }
    </style>

</head>

<body>

<header>
    <h1>Primary School Gallery</h1>
    <p>Memories from My Primary School Days</p>
</header>

<div class="container">

    <h2>Photo Collection</h2>

    <div class="gallery">

        <img src="sksl1.png" alt="Primary School Photo 1">

       

        <img src="sksl2.png" alt="Primary School Photo 2">

        

    </div>

    <div class="button-group">
        <a href="gallery.html" class="btn">← Back to Gallery</a>
        <a href="index.html" class="btn"> Back to Home</a>
    </div>

</div>

<footer>
    <p>This website was created for IML470 Individual Project.</p>
</footer>

</body>
</html>
