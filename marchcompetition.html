<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Running Competition Experience</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #c4bdbd2f;
        }

        header {
            background-color: #52524d;
            color: black;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 85%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #52524d;
        }

        .experience-item {
            margin-top: 40px;
            text-align: center;
        }

        .experience-item img {
            width: 350px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.2);
        }

        .experience-item p {
            margin-top: 15px;
            line-height: 1.8;
            text-align: justify;
        }

        .button-group {
            margin-top: 30px;
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #52524d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
        }

        .btn:hover {
            background-color: #3d3d39;
        }

        footer {
            background-color: #4d4f50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 30px;
        }
    </style>

</head>

<body>

<header>
    <h1>March Competition Experience</h1>
    <p>My March Competition Journey</p>
</header>

<div class="container">

    <h2>March Competition Memories</h2>

    <div class="experience-item">

        <img src="march1.png" alt="March Competition Photo 1">

      
    </div>

   

    <div class="button-group">
        <a href="experience.html" class="btn">← Back to Experience</a>
        <a href="index.html" class="btn"> Back to Home</a>
    </div>

</div>

<footer>
    <p>This website was created for IML470 Individual Project.</p>
</footer>

</body>
</html>
